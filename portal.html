function box(t,v,desc=''){return `<div class="card stat"><span class="muted small">${h(t)}</span><strong>${h(v)}</strong><span class="muted small">${h(desc)}</span></div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${h(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Kayıt bulunmuyor.</td></tr>`}</tbody></table></div>`}function goalCard(){let s=st(),all=mine('exams').sort((a,b)=>a.date.localeCompare(b.date)),latest=k=>all.filter(e=>e.kind===k).at(-1),stats=k=>{let e=latest(k);if(!e)return null;let group=all.filter(x=>x.kind===k&&examScope(x)===examScope(e)).slice(-3);return{last:examTotal(e),average:group.reduce((a,x)=>a+examTotal(x),0)/group.length,count:group.length,scope:examScope(e)}};let t=stats('TYT'),a=stats('AYT');return `<div class="card"><h2>🎯 Öğrenci Hedef Kartı</h2><p><b>${h(s.targetUniversity)} · ${h(s.target)}</b> ${badge(s.field)} · ${h(s.examYear)} YKS</p><div class="grid three">${box('Hedef sıralama',tr(s.rank))}${box('TYT hedef net',tr(s.tyt))}${box('AYT hedef net',tr(s.ayt))}</div><div class="grid two">${box('Son TYT',t?tr(t.last)+' net':'Kayıt yok',t?'Son '+t.count+' eş kapsamlı deneme ort.: '+tr(t.average):'')}${box('Son AYT',a?tr(a.last)+' net':'Kayıt yok',a?'Kapsam: '+a.scope:'')}</div><p><b>TYT hedef farkı:</b> ${t?tr(s.tyt-t.last):'—'} · <b>AYT hedef farkı:</b> ${a?tr(s.ayt-a.last):'—'}</p><div class="progress"><i style="width:${t?Math.min(100,Math.max(0,percent(t.last,s.tyt))):0}%"></i></div><p class="muted small">Sonuçlar yalnızca girilen testleri kapsar. AYT farklı alan testleri toplanarak eşdeğer deneme veya yerleşme olasılığı hesaplanmaz. Hedefleri deneme sonucu otomatik değiştirmez.</p>${['coach','admin'].includes(role)?'<button class="quiet noprint" data-act="gotoProfile">Hedefi düzenle</button>':''}</div>`}

function questionDetails(r){let es=mine('errors').filter(e=>e.resultId===r.id),get=(key)=>Array.isArray(r[key])?r[key]:[];let nums=(xs)=>xs.length?xs.map(i=>h(i)).join(', '):'—';let status=i=>{let e=es.find(x=>x.question===i);return e?' · '+h(e.reason)+' / '+h(e.status)+(e.teacherNote?' · Öğretmen notu: '+h(e.teacherNote):''):''};return `<details class="question-details"><summary>Soru numaraları ve tekrar durumu</summary>${r.entryMode==='quick'?'<p class="muted">Hızlı giriş: yalnızca toplamlar kaydedildi; soru numaraları bilinmiyor.</p>':''}<p><b>Yanlış:</b> ${get('wrongNumbers').length?get('wrongNumbers').map(i=>`Soru ${h(i)}${status(i)}`).join(' ; '):'—'}</p><p><b>Boş:</b> ${get('blankNumbers').length?get('blankNumbers').map(i=>`Soru ${h(i)}${status(i)}`).join(' ; '):'—'}</p><p><b>Henüz çözülmeyen:</b> ${nums(get('remainingNumbers'))}${r.remaining&&get('remainingNumbers').length===0?' · Numaralar bu kayıt için tutulmamış.':''}</p></details>`}

function assignmentDone(a){return a.tests.every(tid=>mine('results').some(r=>r.assignmentId===a.id&&r.testId===tid&&r.remaining===0))}function assignmentProgress(a){return a.tests.filter(tid=>mine('results').some(r=>r.assignmentId===a.id&&r.testId===tid&&r.remaining===0)).length}function assignments(){let can=['teacher','coach'].includes(role);return `${can?`<div class="card"><h2>Öğrencinin kitaplığından ödev ata</h2><form data-form="assignment" id="assignmentForm"><label>Kitap</label><select name="bookId" data-change="assignmentBook" id="abook" required><option value="">Kitap seçin...</option>${studentLibrary().map(v=>`<option value="${h(v.bookId)}">${h(book(v.bookId).title)}</option>`).join('')}</select><label>Konu</label><select name="topicId" data-change="assignmentTopic" id="atopic" required><option value="">Önce kitap...</option></select><div id="atest"><p class="muted small">Konu seçildiğinde testler listelenecek.</p></div><div class="row"><div><label>Son gün</label><input type="date" name="due" value="${iso(3)}" required></div><div><label>Tahmini süre, dakika</label><input type="number" name="minutes" min="1" max="600" value="60" required></div></div><label>Koç / öğretmen notu</label><textarea name="note" maxlength="500" placeholder="Hata yaptığın soruları işaretle."></textarea><button>Ödevi ata</button></form></div>`:''}<div class="card"><h2>${can?'Atanan ödevler':'Ödevlerim'}</h2>${datesort(mine('assignments')).map(a=>{let b=book(a.bookId),t=topic(b,a.topicId),done=assignmentProgress(a);return `<div class="line"><b>${h(b?.title)}</b> · ${h(t?.name)} ${badge(done+'/'+a.tests.length+' test',done===a.tests.length?'good':'warn')}<p class="muted small">${a.tests.map(id=>h(test(b,a.topicId,id)?.name)).join(', ')} · son gün ${h(a.due)} · ${a.minutes} dk</p><p>${h(a.note)}</p>${role==='student'?`<button class="smallbutton" data-act="openAssignment" data-id="${a.id}">Test sonucunu gir</button>`:''}</div>`}).join('')||'<p class="empty">Ödev bulunmuyor.</p>'}</div>`}
function resultForm(a){let b=book(a.bookId),t=topic(b,a.topicId);return `<div class="card"><h2>Test sonucu · ${h(b.title)} / ${h(t.name)}</h2><p class="muted small">Yalnızca yanlış ve boş soruları işaretle. Doğru sayısı otomatik hesaplanır. İlk çözüm, tekrar kaydında korunur.</p><form data-form="result" id="resultForm"><input type="hidden" name="assignmentId" value="${h(a.id)}"><label>Test</label><select name="testId" id="resultTest" data-change="resultTest" required><option value="">Test seçin...</option>${a.tests.map(id=>{let z=test(b,a.topicId,id);return `<option value="${h(id)}">${h(z.name)} · ${z.count} soru</option>`}).join('')}</select><label>Sonuç giriş yöntemi</label><select name="entryMode" id="entryMode" data-change="resultMode"><option value="detail">Soru numaralarını işaretle (önerilen)</option><option value="quick">Yalnızca yanlış/boş sayısını gir</option></select><label class="check"><input type="checkbox" name="complete" id="completeTest" data-change="resultMode" checked> Testin tamamını çözdüm</label><div id="quickFields"></div><div id="markTools"></div><div id="questionSummary" aria-live="polite"></div><div id="questionGrid" class="questions"></div><div class="row"><div><label>Çözüm tarihi</label><input type="date" name="date" value="${iso(0)}" required></div><div><label>Süre (dk)</label><input name="minutes" type="number" min="0" max="600" value="20" required></div></div><button id="saveResult" disabled>Test sonucunu kaydet</button></form></div>`}

function sourceAnalysis(){let books=db.libraries.filter(l=>l.studentId===chosen&&l.status!=='inactive');return `<div class="card"><h2>Kaynak ilerlemesi ve verimlilik</h2><p class="muted small">İlerleme yalnızca katalogda tanımlanmış testlerden hesaplanır; katalog eksikse kitap tamamlanma yüzdesi olarak yorumlanmaz. İlk çözümler ve tekrarlar ayrı gösterilir.</p>${table(['Kaynak / kapsam','Tanımlı test','Bitirilen','İlk çözüm doğruluk','Tekrar bekleyen'],books.map(l=>{let b=book(l.bookId);if(!b)return '';let tests=b.topics.flatMap(t=>t.tests.map(z=>[t.id,z.id]));let rr=mine('results').filter(r=>r.bookId===b.id),first=rr.filter(r=>n(r.attempt)===1),q=first.reduce((a,r)=>a+n(r.total)-n(r.remaining),0),correct=first.reduce((a,r)=>a+n(r.correct),0),done=tests.filter(([tid,zid])=>rr.some(r=>r.topicId===tid&&r.testId===zid&&r.remaining===0)).length,err=mine('errors').filter(e=>e.bookId===b.id&&e.status!=='Doğrulandı').length;return `<tr><td>${h(b.title)}<br>${h(b.exam)} · ${h(b.edition)}</td><td>${tests.length||'Bilinmiyor'}</td><td>${done} / ${tests.length||'?'}</td><td>${q?'%'+percent(correct,q)+' ('+q+' soru)':'Veri yok'}</td><td>${err}</td></tr>`}))}</div>`}

function validateBackup(d){
 if(!d||typeof d!=='object'||Array.isArray(d))return false;
 const collections=['students','catalog','libraries','assignments','results','errors','plans','exams','notes','meetings','dailyReviews','parentRequests','audit','goalRequests','planRequests','sessions'];
 if(!collections.every(k=>Array.isArray(d[k])))return false;
 if(!d.students.length||!d.catalog.length)return false;
 const students=new Set(d.students.map(s=>s.id)),books=new Map(d.catalog.map(b=>[b.id,b]));
 if(students.size!==d.students.length||books.size!==d.catalog.length||students.has(undefined)||books.has(undefined))return false;
 for(const c of collections){const xs=d[c];if(xs.length>250000)return false;if(c==='students'||c==='catalog')continue;
  if(xs.some(x=>!x||!students.has(x.studentId)))return false;
 }
 if(d.libraries.some(l=>!books.has(l.bookId)||books.get(l.bookId).privateStudentId&&books.get(l.bookId).privateStudentId!==l.studentId))return false;
 const assignments=new Map(d.assignments.map(a=>[a.id,a]));
 if(d.assignments.some(a=>!books.has(a.bookId)||!Array.isArray(a.tests)||!a.tests.length))return false;
 for(const r of d.results){
  if(!Number.isInteger(+r.total)||r.total<1||r.total>200||[r.correct,r.wrong,r.blank,r.remaining].some(v=>!Number.isInteger(+v)||+v<0)||(+r.correct)+(+r.wrong)+(+r.blank)+(+r.remaining)!==+r.total)return false;
  const a=assignments.get(r.assignmentId);if(a&&(a.studentId!==r.studentId||a.bookId!==r.bookId||a.topicId!==r.topicId))return false;
  for(const k of ['wrongNumbers','blankNumbers','remainingNumbers'])if(r[k]!==undefined&&(!Array.isArray(r[k])||r[k].some(q=>!Number.isInteger(q)||q<1||q>r.total)))return false;
 }
 if(d.errors.some(e=>!books.has(e.bookId)||!Number.isInteger(+e.question)||+e.question<1))return false;
 return true;
}

 return `<div class="card"><h2>Haftalık uygulama ve takip</h2><p class="muted small">${ws} – ${we} · Planlanan süre ile öğrencinin kendi kaydettiği ek çalışma ayrı tutulur. Tamamlandı işareti gerçek süre kanıtı değildir.</p><div class="grid three">${box('Planlanan süre',tr(w.total/60)+' saat')}${box('Tamamlandı işaretli plan',done.length+' / '+w.plans.length)}${box('Ayrı kaydedilen ek çalışma',tr(extra.reduce((s,x)=>s+n(x.minutes),0)/60)+' saat')}${box('Test sonucu kaydı',r.length)}${box('Zamanı gelen tekrar',repeat.length)}${box('Öğretmen desteği / tekrar yanlış',help.length)}</div>${help.length?'<p class="alert">Öğretmenin aksiyon listesinde destek isteyen veya tekrar yanlış yapılan sorular bulunuyor.</p>':''}</div>`;
}

// Yazdırılabilir raporlar, seçili öğrencinin o andaki verilerinden hazırlanır.
// Harici PDF servisi, bulut yüklemesi veya otomatik PDF dosyası kullanılmaz.
function reportDownloadPanel(){let types=role==='parent'?[['parent','Veli gelişim özeti']]:[['student','Öğrenci gelişim raporu'],['teacher','Öğretmen ders/test raporu'],['coach','Koç haftalık değerlendirme'],['parent','Veli gelişim özeti']];return `<div class="card noprint"><h2>PDF raporları · bilgisayardan kaydet</h2><p class="muted small">Rapor seçilen öğrencinin güncel kayıtlarıyla ayrı, A4 uyumlu sayfada açılır. Açılan pencerede Ctrl+P → PDF olarak kaydet. Tarayıcı açılır pencereyi engellerse bu site için izin ver.</p><div class="row">${types.map(([k,t])=>`<button type="button" data-act="printReport" data-id="${k}">${h(t)} · PDF</button>`).join('')}</div></div>`}
function printableTable(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${h(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}">Henüz kayıt yok.</td></tr>`}</tbody></table>`}
function makeReport(kind){let s=st(),all=mine('results'),first=all.filter(r=>n(r.attempt)===1),rr=first.length?first:[],assign=mine('assignments'),err=mine('errors'),ex=datesort(mine('exams')),pl=mine('plans'),today=iso(0),ws=weekStart(today),we=weekEnd(today),weekPlans=pl.filter(x=>x.date>=ws&&x.date<=we),finished=weekPlans.filter(x=>x.done),late=assign.filter(a=>!assignmentDone(a)&&a.due<today),total=(xs,key)=>xs.reduce((v,x)=>v+n(x[key]),0),active=err.filter(e=>e.status!=='Doğrulandı');
 const totals=`<div class="metrics"><div><b>${assign.filter(assignmentDone).length} / ${assign.length}</b><small>Tamamlanan ödev</small></div><div><b>${first.length}</b><small>İlk test çözümü</small></div><div><b>${ex.length}</b><small>Deneme kaydı</small></div><div><b>${active.length}</b><small>Takip edilen soru</small></div></div>`;
 const exams=printableTable(['Tarih','Sınav / deneme','Kapsam','Net'],ex.slice(0,12).map(e=>`<tr><td>${h(e.date)}</td><td>${h(e.kind)} · ${h(e.name||'Deneme')}</td><td>${h(examScope(e))}</td><td>${tr(examTotal(e))}</td></tr>`));
 const tests=printableTable(['Tarih','Kaynak / konu / test','D','Y','B','Çözülmeyen'],datesort(first).slice(0,35).map(r=>`<tr><td>${h(r.date)}</td><td>${h(book(r.bookId)?.title||'Kaynak bilinmiyor')}<br>${h(topic(book(r.bookId),r.topicId)?.name||'Konu bilinmiyor')} · ${h(test(book(r.bookId),r.topicId,r.testId)?.name||'Test bilinmiyor')}</td><td>${n(r.correct)}</td><td>${n(r.wrong)}</td><td>${n(r.blank)}</td><td>${n(r.remaining)}</td></tr>`));
 const week=printableTable(['Tarih','Ders / çalışma','Planlanan dk.','Durum'],weekPlans.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<tr><td>${h(p.date)} ${h(p.startTime||'')}</td><td>${h(p.course)} · ${h(p.task)}</td><td>${n(p.minutes)}</td><td>${p.done?'Tamamlandı':'Bekliyor'}</td></tr>`));
 const bookRows=db.libraries.filter(l=>l.studentId===chosen&&l.status!=='inactive').map(l=>{let b=book(l.bookId),res=first.filter(r=>r.bookId===l.bookId);return `<tr><td>${h(b?.title||'Eksik kaynak')}</td><td>${res.length}</td><td>${total(res,'correct')}</td><td>${total(res,'wrong')}</td><td>${total(res,'blank')}</td></tr>`});
 let sections='';
 if(kind==='student')sections=totals+`<h2>Hedef kartı</h2><p>${h(s.targetUniversity||'Üniversite hedefi girilmedi')} · ${h(s.target||'Bölüm hedefi girilmedi')} · ${h(s.field)}</p><h2>Son denemeler</h2>${exams}<h2>Kitap bazında ilk çözümler</h2>${printableTable(['Kaynak','Test','Doğru','Yanlış','Boş'],bookRows)}<h2>Test sonuçları</h2>${tests}`;
 else if(kind==='teacher')sections=`<div class="metrics"><div><b>${first.length}</b><small>İlk test</small></div><div><b>${total(first,'wrong')}</b><small>İlk çözüm yanlış</small></div><div><b>${total(first,'blank')}</b><small>İlk çözüm boş</small></div><div><b>${active.length}</b><small>Takip bekleyen soru</small></div></div><h2>Test sonuçları (ilk çözüm)</h2>${tests}<h2>Öğretmen inceleme listesi</h2>${printableTable(['Kaynak / konu','Test / soru','İlk durum','Tekrar durumu'],active.slice(0,60).map(e=>`<tr><td>${h(book(e.bookId)?.title||'Kaynak')} · ${h(topic(book(e.bookId),e.topicId)?.name||'Konu')}</td><td>${h(test(book(e.bookId),e.topicId,e.testId)?.name||'Test')} / ${h(e.question)}</td><td>${e.kind==='blank'?'Boş':'Yanlış'}</td><td>${h(e.status)}</td></tr>`))}`;
 else if(kind==='coach')sections=totals+`<h2>Bu hafta · ${h(ws)} – ${h(we)}</h2><p>Planlanan: ${total(weekPlans,'minutes')} dk · Tamamlandı işaretli: ${finished.length} / ${weekPlans.length} · Geciken ödev: ${late.length}. Tamamlandı işareti gerçek süre kanıtı değildir.</p>${week}<h2>Geciken ödevler</h2>${printableTable(['Kitap / konu','Son tarih','Durum'],late.map(a=>`<tr><td>${h(book(a.bookId)?.title||'Kaynak')} · ${h(topic(book(a.bookId),a.topicId)?.name||'Konu')}</td><td>${h(a.due)}</td><td>${assignmentProgress(a)} / ${a.tests.length} test</td></tr>`))}<h2>Deneme gelişimi</h2>${exams}<h2>Koçun takip listesi</h2>${printableTable(['Tespit','Kontrol tarihi','Aksiyon'],mine('meetings').slice(0,30).map(m=>`<tr><td>${h(m.finding)}</td><td>${h(m.due)}</td><td>${h(m.action)}</td></tr>`))}`;
 else if(kind==='parent')sections=`<p>Bu özet soru numarası, öğrenci günlüğü ve özel öğretmen/koç notu içermez.</p>${totals}<h2>Son denemeler</h2>${exams}<h2>Çalışma düzeni</h2><p>Bu hafta ${weekPlans.length} planlı çalışma, ${finished.length} tamamlandı işareti var. Gecikmiş ödev sayısı: ${late.length}.</p><p class="muted">Net ve sonuçlar, farklı deneme kapsamları arasında doğrudan karşılaştırılmamalıdır.</p>`;
 else return null;
 return {title:({student:'Öğrenci gelişim raporu',teacher:'Öğretmen test ve öğrenme raporu',coach:'Koç haftalık değerlendirme',parent:'Veli gelişim özeti'})[kind],body:sections};
}
function printReport(kind){if(role==='parent'&&kind!=='parent')return msg('Veli rolünde yalnız veli özeti açılır.',true);let data=makeReport(kind);if(!data)return msg('Rapor seçimi geçersiz.',true);let date=iso(0),safeName=st().name.replace(/[\\/:*?"<>|]/g,'-');let w=window.open('','_blank');if(!w)return msg('PDF penceresi engellendi. Tarayıcıdan açılır pencereye izin ver.',true);let doc=`<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>${h(data.title)} - ${h(safeName)} - ${date}</title><style>@page{size:A4;margin:15mm 13mm}body{font:11px Arial,sans-serif;color:#183047;line-height:1.45}header{border-bottom:3px solid #235bd1;padding-bottom:10px;margin-bottom:20px}header h1{font-size:21px;margin:0 0 5px;color:#153a70}h2{font-size:14px;margin:19px 0 8px;color:#153a70;break-after:avoid}table{width:100%;border-collapse:collapse;font-size:10px;table-layout:auto}th,td{border-bottom:1px solid #d6dfec;padding:6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e9f0fb}thead{display:table-header-group}tr{break-inside:avoid}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metrics div{border:1px solid #dae3f0;border-radius:6px;padding:10px}.metrics b{display:block;font-size:18px}.metrics small{display:block;color:#52667e}footer{margin-top:24px;border-top:1px solid #b9c9dd;padding-top:7px;font-size:9px;color:#536779}.toolbar{padding:12px;background:#eef4ff;text-align:center}@media print{.toolbar{display:none!important}body{margin:0}}@media screen{body{max-width:850px;margin:22px auto;padding:0 15px}}</style></head><body><div class="toolbar"><button onclick="window.print()">PDF olarak kaydet / Yazdır</button> &nbsp; Ctrl+P → Hedef: PDF olarak kaydet</div><header><h1>${h(data.title)}</h1><div><b>Öğrenci:</b> ${h(st().name)} &nbsp; <b>Rapor tarihi:</b> ${date} &nbsp; <b>Alan:</b> ${h(st().field)}</div></header>${data.body}<footer>YKS Koçluk Portalı · ${date} · Seçili öğrencinin demo kayıtlarından oluşturulmuştur. İlk test sonuçları tekrar çözümüyle değiştirilmez. Bu rapor gerçek kullanıcı kimliği/doğrulanmış öğrenci verisi belgesi değildir.</footer></body></html>`;w.document.open();w.document.write(doc);w.document.close();w.focus()}
$('role').onchange=e=>{role=e.target.value;screen='home';start()};$('student').onchange=e=>{chosen=e.target.value;start()};$('reset').onclick=()=>{if(confirm('Yalnızca bu cihazdaki DEMO verileri sıfırlansın mı?')){db=seed();chosen=db.students[0].id;save();start()}};start();

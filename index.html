
<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>YKS Aile Koçluk Portalı</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- GİRİŞ EKRANI -->

    <div id="login" class="login card">

        <h1>🎓 YKS Aile Koçluk Portalı</h1>

        <p>Tek öğrencinin ortak takip alanı</p>

        <form id="login-form">

            <label>
                E-posta

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    required
                >
            </label>

            <label>
                Şifre

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button class="primary">
                Giriş yap
            </button>

            <p
                id="login-error"
                class="error"
                role="alert"
            ></p>

        </form>

    </div>


    <!-- ANA UYGULAMA -->

    <div id="app" hidden>

        <header>

            <div>
                <strong>🎓 YKS Portalı</strong>

                <span id="hello"></span>
            </div>

            <button
                id="logout"
                class="subtle"
            >
                Çıkış
            </button>

        </header>


        <div class="shell">

            <!-- MENÜ -->

            <nav id="nav"></nav>


            <!-- SAYFA İÇERİĞİ -->

            <main id="content"></main>

        </div>

    </div>


    <!-- BİLDİRİMLER -->

    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- UYGULAMA -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>

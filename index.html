<!-- SİLME ONAY MODALI -->
    <div class="modal fade" id="resetConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-danger">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">⚠️ Kritik İşlem: Tüm Verileri Sıfırla</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-danger fw-bold">Bu işlem tüm test geçmişini, denemeleri ve ödevleri silecektir!</p>
                    <input type="text" id="confirm-input" class="form-control text-center fw-bold" placeholder="Buraya SIL yazın" oninput="checkConfirmInput()">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" id="confirm-delete-btn" class="btn btn-danger" disabled onclick="window.tumTestVerileriniSil()">Kalıcı Olarak Temizle</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function checkConfirmInput() {
            const val = document.getElementById('confirm-input').value.trim().toUpperCase();
            const btn = document.getElementById('confirm-delete-btn');
            if (val === "SIL") { 
                btn.removeAttribute('disabled'); 
            } else { 
                btn.setAttribute('disabled', 'true'); 
            }
        }
    </script>
